name: Run Notebook Daily

on:
  schedule:
    - cron: '0 6 * * *'  # Runs at midnight UTC every day
  workflow_dispatch:  # Allows manual testing

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install packages
      run: |
        pip install jupyter nbconvert gspread google-auth
    
    - name: Run notebook
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: |
        jupyter nbconvert --to notebook --execute attendance.ipynb
    
    - name: Show results
      run: echo "Notebook ran successfully!"
